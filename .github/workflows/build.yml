name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Creating GitHub Releases requires repository contents:write.
permissions:
  contents: write

# Only the latest push build needs to publish a new preview APK.
concurrency:
  group: hotwordbridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for keyword tokenization
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sentencepiece
        run: python3 -m pip install --disable-pip-version-check sentencepiece==0.2.1
      - name: Download pinned offline engine and model
        run: bash scripts/prepare-sherpa.sh
      # GitHub-hosted Ubuntu includes the Android SDK.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct-download APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HotwordBridge.apk
          test -s dist/HotwordBridge.apk
          sha256sum dist/HotwordBridge.apk
      - name: Publish directly downloadable APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/HotwordBridge.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HotwordBridge · Android test build ${GITHUB_RUN_NUMBER}" \
            --notes "Direct-install Android APK. No ZIP extraction required. This is an experimental debug build; wake-word detection has not been verified on all phones. Compiled from commit ${GITHUB_SHA}." \
            --latest
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/HotwordBridge.apk" >> "$GITHUB_STEP_SUMMARY"
