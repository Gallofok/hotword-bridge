name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Creating GitHub Releases requires repository contents:write.
permissions:
  contents: write

# Only the latest push build needs to publish a new preview APK.
concurrency:
  group: hotwordbridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned openWakeWord feature models
        run: bash scripts/prepare-oww.sh
      # GitHub-hosted Ubuntu includes the Android SDK.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run detector unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests
      - name: Restore signing key
        env:
          HWB_KEYSTORE_BASE64: ${{ secrets.HWB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HWB_KEYSTORE_BASE64" ]; then
            printf '%s' "$HWB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hwb-release.p12"
            echo "HWB_KEYSTORE_FILE=$RUNNER_TEMP/hwb-release.p12" >> "$GITHUB_ENV"
          else
            echo "No signing key available (for example a pull request from a fork): using the temporary debug key."
          fi
      - name: Assemble debug APK
        env:
          HWB_KEYSTORE_PASSWORD: ${{ secrets.HWB_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK signature
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt" 2>&1 || { cat "$RUNNER_TEMP/certs.txt"; exit 1; }
          grep -v '^WARNING' "$RUNNER_TEMP/certs.txt" || true
          actual="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" | sed 's/.*digest: *//')"
          echo "APK signing certificate SHA-256: $actual"
          if [ -n "${HWB_KEYSTORE_FILE:-}" ]; then
            test "$actual" = "$EXPECTED_CERT_SHA256" || { echo "APK is not signed with the permanent key" >&2; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Refusing to publish an APK signed with a temporary key" >&2; exit 1
          fi
        env:
          # SHA-256 of the permanent signing certificate (public information).
          EXPECTED_CERT_SHA256: ce9ed7fe261d06957c142dfe2b14467de37d50d91a1a50ba4afafe9e142c5a90
      - name: Prepare direct-download APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HotwordBridge.apk
          test -s dist/HotwordBridge.apk
      - name: Publish directly downloadable APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/HotwordBridge.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HotwordBridge · Android test build ${GITHUB_RUN_NUMBER}" \
            --notes "Direct-install Android APK. Experimental debug build. Compiled from commit ${GITHUB_SHA}." \
            --latest
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/HotwordBridge.apk" >> "$GITHUB_STEP_SUMMARY"
