name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for keyword tokenization
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sentencepiece
        run: python3 -m pip install --disable-pip-version-check sentencepiece==0.2.1
      - name: Download pinned offline engine and model
        run: bash scripts/prepare-sherpa.sh
      # The GitHub Ubuntu runner provides the Android SDK.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hotword-bridge-sherpa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
